<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cài đặt — Bắt đơn Mess</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  body{margin:0;background:#f0f2f5;color:#1c1e21;font-size:14px}
  main{max-width:560px;margin:40px auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  h1{font-size:20px;margin:0 0 16px;color:#1f6f43}
  label{display:block;font-weight:600;margin:14px 0 4px}
  small{color:#606770;font-weight:400}
  input{width:100%;padding:8px 10px;border:1px solid #ccd0d5;border-radius:6px;font-size:14px}
  .row{display:flex;gap:8px;margin-top:18px}
  button{cursor:pointer;border-radius:6px;padding:9px 16px;font-size:14px;font-weight:600;border:1px solid #1f6f43;background:#1f6f43;color:#fff}
  button.sec{background:#fff;color:#1f6f43}
  #msg{margin-top:14px;padding:8px 10px;border-radius:6px;word-break:break-all}
  .ok{background:#e3f4e8;color:#1f6f43}
  .err{background:#fde2e1;color:#8a1c14}
</style>
</head>
<body>
<main>
  <h1>⚙️ Cài đặt Bắt đơn Mess</h1>
  <label>Địa chỉ web quản lý đơn<br><small>Ví dụ: https://don.tenmien.com — hoặc link Apps Script …/exec nếu vẫn dùng Google Sheets</small></label>
  <input id="apiUrl" placeholder="https://don.tenmien.com">
  <label>Mã API<br><small>Web → Cài đặt → “Tạo mã mới” (bắt đầu bằng ext_…). Nếu dùng Google Sheets: mã SECRET trong Code.gs</small></label>
  <input id="token">
  <div class="row">
    <button id="save">Lưu</button>
    <button id="test" class="sec">Lưu &amp; kiểm tra kết nối</button>
  </div>
  <div id="msg" hidden></div>
</main>
<script src="options.js"></script>
</body>
</html>
